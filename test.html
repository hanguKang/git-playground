            var endDp = $('#' + endId);

            if (startId != null && startId != "" && startId != undefined) {

                startDp.datepicker(initDate);

                if (endId != null && endId != "" && endId != undefined) {

                    if (endYearLimit != null && endYearLimit != "" && endYearLimit != undefined) {
                        endYearLimit = startYearLimit;
                    }
                    initSelectOptionAdd(endYearLimit, endAddM);
                    endDp.datepicker(initDate);
                }

            } else {
                initSelectOptionAdd("", "");
                dp.datepicker(initDate); // default
            }
            formRefresh();
        }

            function keyBordHandle(np, index) {
                if (np == 'next') {
                    if (keyNum[index] < keyMax[index]) {

                        keyNum[index] = 0;

                } else {
                    if (keyNum[index] > 0) {

        // input clear(삭제) 버턴 기능 
        function inputClearBtn() {

            document.addEventListener('click', function (e) {
                const btn = e.target.closest('.clear_btn')
                if (Ibtn) return

                const wrapper = btn.closest('.input_clear_wrap')
                if (Iwrapper) return

                const input = wrapper.querySelector('.input_clear_wrap input')
                if (!input) return

                input.value = '';
                input.focus()

                input.dispatchEvent(new Event('input', { bubbles: true }));
                input.dispatchEvent(new Event('change', { bubbles: true }));
            })

        }

        // 전화번호 하이픈 변환 함수
        function formatPhoneNumber(value) {

            const nums = value.replace(/[^0-9]/g, '');

            if (nums.length < 4) return nums;

            if (nums.length < 7) {
                return nums.substr(0, 3) + '-' + nums.substr(3);
            }

            if (nums.length < 11) {

                return nums.substr(0, 3) + '-' + nums.substr(3, 3) + '-' + nums.substr(6);
            }
            return nums.substr(0, 3) + '-' + nums.substr(3, 4) + '-' + nums.substr(7, 4);

        }
        // 사업자등록번호 하이픈 변환 함수

        function formatBusinessNumber(value) {

            const nums = value.replace(/[^0-9]/g, '');
            if (nums.length < 4) return nums;
            if (nums.length < 6) {
                return nums.substr(0, 3) + '-' + nums.substr(3);
            }
            return nums.substr(0, 3) + '-' + nums.substr(3, 2) + '-' + nums.substr(5, 5);

        }

        /* 웹접근성 */
        $(function () {
            inputClearBtn(); // input clear() +
            a11yAccess();

            // A11YTASK-601
            var chosenContainer = $('.chosen-container');
            if (chosenContainer.length > 0) {
                chosenContainer.on('click', function () {
                    a11yAccess()
                })
            }

            document.addEventListener('input', function (e) {
                const input = e.target;
                if (!input || !input.dataset.type) return;

                const dataType = input.dataset.type; // data-type 값 가져오기

                let formatted = '';

                if (dataType === 'input-tel') {
                    formatted = formatPhoneNumber(input.value);

                } else if (dataType === 'input-business') {
                    formatted = formatBusinessNumber(input.value);
                } else {
                    return; // 지정된 타입이 아니면 무시
                }

                //2. 커서 위치 보정 로직 (중간 수정 시 튕김 방지)
                const before = input.value;
                const cursor = input.selectionStart;
                const digitsBeforeCursor = before.slice(0, cursor).replace(/[^0-9]/g, '').length;

                input.value = formatted;

                let seen = 0;
                let finalCursorPos = formatted.length; // 기본으로 맨 뒤

                for (let pos; pos < formatted.length; pos++) {
                    if (/[0-9]/.test(formatted[pos])) {
                        seen++;
                    }
                    if (seen === digitsBeforeCursor) {
                        finalCursorPos = pos + 1;
                        break;
                    }

                }
                // 계산된 올바른 위치로 커서 고정
                input.setSelectionRange(finalCursorPos, finalCursorPos);
            });

        });
